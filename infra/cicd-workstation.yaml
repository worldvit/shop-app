AWSTemplateFormatVersion: "2010-09-09"
Description: CI/CD lab workstation (runs Jenkins). Default VPC, terminal via Session Manager, UI ports 8080/8081 open to my IP only.

Parameters:
  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
  InstanceType:
    Type: String
    Default: t3.medium
  MyIpCidr:
    Type: String
    Description: My public IP followed by /32 (e.g. 203.0.113.10/32). Jenkins (8080) and Argo CD (8081) UI are open to this address only.
    AllowedPattern: ^(\d{1,3}\.){3}\d{1,3}/32$
    ConstraintDescription: Enter an IPv4 address followed by /32

Resources:
  WorkstationRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub cicd-workstation-role-${AWS::Region}
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
        - arn:aws:iam::aws:policy/AmazonEC2ContainerRegistryPowerUser
      Policies:
        # Jenkins 배포 단계용 최소 권한: 태스크 정의 새 리비전 등록 + 서비스 업데이트만 허용
        - PolicyName: ecs-deploy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - ecs:DescribeServices
                  - ecs:UpdateService
                  - ecs:DescribeTaskDefinition
                  - ecs:RegisterTaskDefinition
                  - ecs:ListServiceDeployments
                  - ecs:DescribeServiceDeployments
                  - eks:DescribeCluster        # Day 3: kubeconfig 만들기 (클러스터 안 권한은 EKS 액세스 항목이 정함)
                  - eks:ListClusters
                Resource: "*"
              # ECR 관리형 정책(PowerUser)에는 저장소 생성 권한이 없어 shop/* 저장소 생성만 추가로 허용
              - Effect: Allow
                Action: [ecr:CreateRepository, ecr:TagResource]
                Resource: !Sub arn:aws:ecr:${AWS::Region}:${AWS::AccountId}:repository/shop/*
              - Effect: Allow
                Action: iam:PassRole
                Resource: !Sub arn:aws:iam::${AWS::AccountId}:role/shop-ecs-exec-role-*
                Condition:
                  StringEquals: { iam:PassedToService: ecs-tasks.amazonaws.com }
      Tags:
        - { Key: Course, Value: "03" }
        - { Key: Role, Value: workstation }

  WorkstationProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref WorkstationRole]

  WorkstationSG:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: cicd-workstation - Jenkins and Argo CD UI from my IP only
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 8080, ToPort: 8080, CidrIp: !Ref MyIpCidr, Description: Jenkins UI }
        - { IpProtocol: tcp, FromPort: 8081, ToPort: 8081, CidrIp: !Ref MyIpCidr, Description: Argo CD UI }
      Tags:
        - { Key: Name, Value: cicd-workstation-sg }
        - { Key: Course, Value: "03" }
        - { Key: Role, Value: workstation }

  WorkstationLT:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateData:
        MetadataOptions:
          HttpTokens: required
          HttpPutResponseHopLimit: 2   # Jenkins 컨테이너 안에서도 IAM 역할 자격 증명을 받기 위해 2로 설정

  Workstation:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref LatestAmiId
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref WorkstationProfile
      SecurityGroupIds: [!GetAtt WorkstationSG.GroupId]
      LaunchTemplate:
        LaunchTemplateId: !Ref WorkstationLT
        Version: !GetAtt WorkstationLT.LatestVersionNumber
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs: { VolumeSize: 30, VolumeType: gp3, Encrypted: true }
      Tags:
        - { Key: Name, Value: cicd-workstation }
        - { Key: Course, Value: "03" }
        - { Key: Role, Value: workstation }
      UserData:
        Fn::Base64: |
          #!/bin/bash
          set -eux
          dnf install -y docker git jq
          systemctl enable --now docker
          # AL2023 docker 패키지에는 compose·buildx 플러그인이 없어 GitHub 릴리스에서 설치
          P=/usr/local/lib/docker/cli-plugins; mkdir -p $P
          curl -fsSL https://github.com/docker/compose/releases/latest/download/docker-compose-linux-x86_64 -o $P/docker-compose
          BX=$(curl -fsSL https://api.github.com/repos/docker/buildx/releases/latest | jq -r .tag_name)
          curl -fsSL https://github.com/docker/buildx/releases/download/$BX/buildx-$BX.linux-amd64 -o $P/docker-buildx
          chmod +x $P/*
          # kubectl (Day 3~4 EKS) — 1.36 계열 최신 패치
          KV=$(curl -fsSL https://dl.k8s.io/release/stable-1.36.txt)
          curl -fsSL -o /usr/local/bin/kubectl https://dl.k8s.io/release/$KV/bin/linux/amd64/kubectl && chmod +x /usr/local/bin/kubectl
          # 스왑 2GB: Jenkins와 이미지 빌드가 동시에 돌 때 메모리 부족 방지
          fallocate -l 2G /swapfile && chmod 600 /swapfile && mkswap /swapfile && swapon /swapfile
          echo '/swapfile swap swap defaults 0 0' >> /etc/fstab
          # Session Manager 사용자(ssm-user)가 sudo 없이 docker를 쓰도록 미리 그룹 지정
          getent group docker && (id ssm-user || useradd -m ssm-user) && usermod -aG docker ssm-user
          echo 'ssm-user ALL=(ALL) NOPASSWD:ALL' > /etc/sudoers.d/ssm-agent-users
          mkdir -p /var/jenkins_home && chown 1000:1000 /var/jenkins_home

Outputs:
  InstanceId:
    Value: !Ref Workstation
    Description: Session Manager target instance
  JenkinsUrl:
    Value: !Sub http://${Workstation.PublicIp}:8080
    Description: Jenkins UI URL (the IP changes after stop/start - check the EC2 console)

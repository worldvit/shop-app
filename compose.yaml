# 로컬 실행: docker compose up -d --build  →  http://localhost:8000
services:
  frontend:
    build: { context: ./frontend, target: runtime }
  product-api:
    build: { context: ./product-api, target: runtime }
  order-api:
    build: { context: ./order-api, target: runtime }
  gateway:
    image: nginx:1.29-alpine
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8000:80"
    depends_on: [frontend, product-api, order-api]
